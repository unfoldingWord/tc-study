name: Deploy TC-Study to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/tc-study/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'
      - 'config/**'
      - '.github/workflows/deploy-tc-study.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'apps/tc-study/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'
      - 'config/**'
      - '.github/workflows/deploy-tc-study.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    # Unit + typecheck + lint (includes arch-freeze LOC/`as any` ratchets — not behavioral QA)
    name: TC-Study unit + arch-freeze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Vite aliases root node_modules/linked-panels/dist (npm package). Bun sometimes
      # leaves the symlink without extracting dist on clean Linux runners — repair if needed.
      - name: Ensure linked-panels dist
        run: |
          if [ ! -f node_modules/linked-panels/dist/index.js ]; then
            echo "linked-panels dist missing after install; forcing reinstall of package"
            rm -rf node_modules/linked-panels node_modules/.bun/linked-panels@*
            bun install --frozen-lockfile
          fi
          test -f node_modules/linked-panels/dist/index.js
          ls -la node_modules/linked-panels/dist/index.js

      # Build package deps without swallowing errors (no `|| true`)
      - name: Build workspace packages (tc-study deps)
        run: bunx turbo run build --filter=tc-study^...

      - name: Test + type-check + lint
        working-directory: apps/tc-study
        run: bun run check

      - name: Production build
        working-directory: apps/tc-study
        run: bun run build

      - name: Strip preloaded JSON (deploy-ready dist)
        working-directory: apps/tc-study
        run: node scripts/strip-preloaded-from-dist.cjs

      - name: Upload deploy-ready dist
        uses: actions/upload-artifact@v4
        with:
          name: tc-study-dist
          path: apps/tc-study/dist
          retention-days: 2

  e2e:
    runs-on: ubuntu-latest
    name: TC-Study behavioral E2E
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No second app/package build — serve the quality job's deploy-ready dist
      - name: Download deploy-ready dist
        uses: actions/download-artifact@v4
        with:
          name: tc-study-dist
          path: apps/tc-study/dist

      - name: Install Playwright Chromium
        working-directory: apps/tc-study
        run: bunx playwright install --with-deps chromium

      - name: Run E2E journeys
        working-directory: apps/tc-study
        run: bun run test:e2e
        env:
          CI: true
          E2E_USE_EXISTING_DIST: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/tc-study/playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    needs: [quality, e2e]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deploy-ready dist
        uses: actions/download-artifact@v4
        with:
          name: tc-study-dist
          path: apps/tc-study/dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: tc-study
          directory: apps/tc-study/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
