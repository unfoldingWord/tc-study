name: Pack tests

# The test suites of the language packs: format 3 (language-pack-v3), the shared library (language-pack-client), and
# the pipeline's command line (resource-pipeline cli/). The tc-study job runs none of them, so on 2026-11-16 a merge
# (#86) reached master with five failing pipeline tests (fixed in #88). These suites write packs to temp folders and
# spawn the CLIs, so a test can take longer than bun's 5 s default: they run with a longer timeout.

on:
  push:
    branches:
      - master
    paths:
      - 'packages/**'
      - 'scripts/build-pack-tools.sh'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/language-packs.yml'
      - '.github/workflows/pack-tests.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'packages/**'
      - 'scripts/build-pack-tools.sh'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/language-packs.yml'
      - '.github/workflows/pack-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-tests:
    # Pinned like the other jobs: ubuntu-latest now rolls to 26.04, where better-sqlite3 9.6 does not build.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: Pack tests (${{ matrix.suite.name }})
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: language-pack-v3, dir: packages/language-pack-v3, args: '' }
          - { name: language-pack-client, dir: packages/language-pack-client, args: '' }
          - { name: resource-pipeline cli, dir: packages/resource-pipeline, args: 'cli/' }
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow-v3.test.ts reads an older revision of language-packs.yml with `git show`.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      # Installs and builds the dist/ the pack commands read (requireFreshBuilds stops without them).
      - name: Build pack tools
        run: bash scripts/build-pack-tools.sh

      - name: Test
        working-directory: ${{ matrix.suite.dir }}
        run: bun test --timeout 120000 ${{ matrix.suite.args }}
