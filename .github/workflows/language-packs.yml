name: Language packs

# Builds one language's packs and publishes them to the packs bucket (packages/resource-pipeline/cli/publish-language.ts),
# and reports the build state next to the catalog (status/<compat>/<lang>.json) for the serving Worker's dispatch guard.
# Dispatched by hand, or by the Worker (a GitHub App with actions: write on this repository only).

run-name: Packs ${{ inputs.language }} (${{ inputs.mode }}, ${{ inputs.target }}${{ inputs.parts && ', parts' || '' }}${{ inputs.compare && ', compare' || '' }})

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language code, as in es-419 or pt-br
        required: true
        type: string
      mode:
        description: publish uploads to the bucket; no-upload builds into the runner and puts nothing (a measurement)
        required: false
        type: choice
        options:
          - publish
          - no-upload
        default: publish
      target:
        description: Which bucket, through the GitHub Environment that holds its R2 token
        required: false
        type: choice
        options:
          - staging
          - production
        default: staging
      compat:
        description: The pack compat key the dispatcher expects (the Worker sends its own); a run of other code stops
        required: false
        type: string
        default: ''
      force:
        description: Build and publish even when nothing it is built from changed (a builder fix no stamp shows)
        required: false
        type: boolean
        default: false
      parts:
        description: Build as parts, one book at a time (no-upload only, until parts are published)
        required: false
        type: boolean
        default: false
      compare:
        description: With parts, also build the whole packs and fail on any row the two builds do not share
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One build per language and bucket at a time. A run queued behind it waits instead of cancelling the one in flight.
# `target` is empty when a dispatch omits it, and then means staging, as in the environment below.
# Languages are not serialized against each other: each catalog entry names its own originals pack, so a phone reading
# one entry stays consistent, and originals.json is last-writer-wins between valid builds. (A shared job-level group
# would not do: GitHub keeps one pending job per group and cancels the older pending ones.)
concurrency:
  group: packs-${{ inputs.target || 'staging' }}-${{ inputs.language }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ${{ inputs.target == 'production' && 'packs-production' || 'packs-staging' }}
    env:
      LANGUAGE: ${{ inputs.language }}
      MODE: ${{ inputs.mode }}
      REQUESTED_COMPAT: ${{ inputs.compat }}
      FORCE: ${{ inputs.force }}
      PARTS: ${{ inputs.parts }}
      COMPARE: ${{ inputs.compare }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The language reaches a shell, a bucket key and a log: only a plain code passes. The value is never printed.
      - name: Validate inputs
        run: |
          if ! [[ "$LANGUAGE" =~ ^[a-z]{2,3}(-[A-Za-z0-9]+)*$ ]]; then
            echo "::error::language is not a language code"
            exit 1
          fi
          case "$MODE" in publish | no-upload) ;; *) echo "::error::mode must be publish or no-upload"; exit 1 ;; esac
          if [ "$PARTS" = true ] && [ "$MODE" != no-upload ]; then
            echo "::error::parts builds only with mode no-upload"
            exit 1
          fi
          # A parts run decides nothing, it always builds: force would do nothing.
          if [ "$PARTS" = true ] && [ "$FORCE" = true ]; then
            echo "::error::parts and force do not go together"
            exit 1
          fi
          if [ "$COMPARE" = true ] && [ "$PARTS" != true ]; then
            echo "::error::compare needs parts (and so mode no-upload)"
            exit 1
          fi
          # The same shape the Worker and packs-status check: the compat becomes a bucket key.
          if [ -n "$REQUESTED_COMPAT" ] && ! [[ "$REQUESTED_COMPAT" =~ ^f[0-9]+\.[0-9]+-u[A-Za-z0-9_.]+-p[0-9]+-q[0-9]+-a[0-9]+-t[0-9]+$ ]]; then
            echo "::error::compat is not a compat key"
            exit 1
          fi

      - name: Checkout tc-study
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Not shallow: the MACULA identity is the last commit that touched trees/ and referents/, found in the history.
      - name: Clone Taller
        run: git clone --filter=blob:none https://github.com/idiomaspuentes/taller "$RUNNER_TEMP/taller"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Build pack tools
        run: bash scripts/build-pack-tools.sh

      # The Worker asks for builds of the compat it was deployed with. Code that builds another one (a compat bump not yet
      # followed by a v2 redeploy) would publish where the Worker never looks and be dispatched again every hour: it marks
      # the requested compat failed instead, which the Worker's guard reads, and builds nothing.
      # Not for a parts run: parts have their own compat (PARTS_FORMAT_VERSION, f2.0), which no Worker asks for yet,
      # and a parts run publishes nothing for the Worker to find.
      - name: Check compat
        if: inputs.compat != '' && !inputs.parts
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          built="$(bun packages/resource-pipeline/cli/packs-status.ts --print-compat)"
          if [ "$REQUESTED_COMPAT" = "$built" ]; then exit 0; fi
          echo "::error::asked for compat $REQUESTED_COMPAT, this code builds $built: update CURRENT_PACK_COMPAT in translation-helps-mcp (v2) and redeploy"
          if [ "$MODE" = publish ]; then
            bun packages/resource-pipeline/cli/packs-status.ts --lang "$LANGUAGE" --state failed --run "$RUN_URL" --compat "$REQUESTED_COMPAT"
          fi
          exit 1

      # Runs that fail before this step leave no status of their own; the Worker writes `running` when it dispatches
      # (plan 2, Task 5), and counts a `running` mark it replaces after 5.5 hours as a failure, so they still count.
      # Only a publish run owns the language's status: a measurement must not flip it, nor count as a failure.
      - name: Status running
        id: running
        if: inputs.mode == 'publish'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun packages/resource-pipeline/cli/packs-status.ts --lang "$LANGUAGE" --state running --run "$RUN_URL"

      # A no-upload run is given no bucket: against the real one it would stop at «unchanged» and measure nothing.
      - name: Build and publish
        id: publish
        env:
          GENERATOR: ${{ github.sha }}
          R2_ENDPOINT: ${{ inputs.mode == 'publish' && secrets.R2_ENDPOINT || '' }}
          R2_BUCKET: ${{ inputs.mode == 'publish' && secrets.R2_BUCKET || '' }}
          R2_ACCESS_KEY_ID: ${{ inputs.mode == 'publish' && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.mode == 'publish' && secrets.R2_SECRET_ACCESS_KEY || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/packs-out"
          args=(--lang "$LANGUAGE" --work "$RUNNER_TEMP/packs-work" --generator "$GENERATOR" --macula "$RUNNER_TEMP/taller/public" --lexicons-ref master)
          runner=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          if [ "$MODE" = no-upload ]; then
            args+=(--no-upload)
            if [ "$PARTS" = true ]; then args+=(--parts); fi
            command -v /usr/bin/time > /dev/null || { sudo apt-get update -q && sudo apt-get install -y time; }
            runner=(/usr/bin/time -v -o "$RUNNER_TEMP/packs-out/time.txt")
          fi
          # What Door43 or a library prints could look like a workflow command: none is read until the token comes back.
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          "${runner[@]}" bun packages/resource-pipeline/cli/publish-language.ts "${args[@]}" > "$RUNNER_TEMP/packs-out/stdout.txt"
          tail -n 1 "$RUNNER_TEMP/packs-out/stdout.txt" > "$RUNNER_TEMP/packs-out/result.json"
          # The step's exit code decides success; an unreadable result line only costs the summary its outcome.
          outcome="$(jq -r '.outcome // "unknown"' "$RUNNER_TEMP/packs-out/result.json" || echo unknown)"
          {
            echo "### Packs: $LANGUAGE"
            echo "Outcome: \`$outcome\`"
            if [ -f "$RUNNER_TEMP/packs-out/time.txt" ]; then
              echo
              echo '```'
              grep -E 'Maximum resident set size|Elapsed \(wall clock\)' "$RUNNER_TEMP/packs-out/time.txt" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The parts build must pack exactly the rows the whole build packs (plan 2b-1, Task 7). Both run here, where Door43
      # is reachable, into separate work folders; nothing is uploaded. Runs even when the parts step failed, since a
      # parts run exits 1 on failures it still wrote out, and the comparison says which rows those failures cost.
      - name: Whole build and compare
        if: always() && inputs.compare && steps.publish.conclusion != 'skipped'
        env:
          GENERATOR: ${{ github.sha }}
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          whole="$RUNNER_TEMP/packs-whole"
          bun packages/resource-pipeline/cli/publish-language.ts --lang "$LANGUAGE" --work "$whole" --generator "$GENERATOR" \
            --macula "$RUNNER_TEMP/taller/public" --lexicons-ref master --no-upload > "$RUNNER_TEMP/packs-out/whole-stdout.txt"
          status=0
          bun packages/resource-pipeline/cli/compare-parts.ts --pack "$whole/packs/$LANGUAGE.langpack.zip" \
            --originals "$whole/packs/originals.langpack.zip" --parts "$RUNNER_TEMP/packs-work" --examples 20 \
            > "$RUNNER_TEMP/packs-out/compare.txt" || status=$?
          {
            echo
            echo "### Compare (whole vs parts): exit $status"
            echo '```'
            head -n 200 "$RUNNER_TEMP/packs-out/compare.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # A cancelled or timed-out run counts as a failed one: left at «running» it would hold the dispatch for hours.
      - name: Status result
        if: always() && inputs.mode == 'publish' && steps.running.outcome == 'success'
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          state=failed
          if [ "$PUBLISH_OUTCOME" = success ]; then state=ok; fi
          bun packages/resource-pipeline/cli/packs-status.ts --lang "$LANGUAGE" --state "$state" --run "$RUN_URL"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packs-result
          # parts-report.json: each unit's memory and time, what a parts run measures (there too when jobs failed).
          path: |
            ${{ runner.temp }}/packs-out
            ${{ runner.temp }}/packs-work/parts-report.json
          if-no-files-found: ignore
          retention-days: 14
