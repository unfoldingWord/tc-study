name: Language packs

# Builds one language's packs and publishes them to the packs bucket (packages/resource-pipeline/cli/publish-language.ts),
# and reports the build state next to the catalog (status/<compat>/<lang>.json) for the serving Worker's dispatch guard.
# With `parts` it builds the language one book at a time and publishes the parts (staging only, until the Worker serves
# them) under the parts compat (f2.0-…), with that compat's status: nothing a whole build or the Worker reads changes.
# Parts are published only from master, which also writes the code it builds with to status/builder.json (as
# packs-builder.yml does) and records that code in the ok status; a parts measurement (no-upload) may run from a branch.
# Dispatched by hand, or by the Worker (a GitHub App with actions: write on this repository only).

run-name: Packs ${{ inputs.language }} (${{ inputs.mode }}, ${{ inputs.target }}${{ inputs.parts && ', parts' || '' }}${{ inputs.compare && ', compare' || '' }})

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language code, as in es-419 or pt-br
        required: true
        type: string
      mode:
        description: publish uploads to the bucket; no-upload builds into the runner and puts nothing (a measurement)
        required: false
        type: choice
        options:
          - publish
          - no-upload
        default: publish
      target:
        description: Which bucket, through the GitHub Environment that holds its R2 token
        required: false
        type: choice
        options:
          - staging
          - production
        default: staging
      compat:
        description: The pack compat key the dispatcher expects (the Worker sends its own); a run of other code stops
        required: false
        type: string
        default: ''
      force:
        description: Build and publish even when nothing it is built from changed (a builder fix no stamp shows)
        required: false
        type: boolean
        default: false
      parts:
        description: 'Build as parts, one book at a time (publish: staging only, until the Worker serves parts)'
        required: false
        type: boolean
        default: false
      compare:
        description: With parts, also build the whole packs and fail on any row the two builds do not share
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One build per language and bucket at a time. A run queued behind it waits instead of cancelling the one in flight.
# `target` is empty when a dispatch omits it, and then means staging, as in the environment below.
# Languages are not serialized against each other: each catalog entry names its own originals pack, so a phone reading
# one entry stays consistent, and originals.json is last-writer-wins between valid builds. (A shared job-level group
# would not do: GitHub keeps one pending job per group and cancels the older pending ones.)
# Parts runs queue apart from whole runs of the same language (packs-<target>-parts-<lang>): they write other keys, and a
# whole run queued behind a build would otherwise cancel a pending parts run the Worker had marked `running`, a mark
# that later counts as a failure. A parts measurement (no-upload) queues apart again (…-parts-measure-<lang>): it writes
# nothing, and must not cancel a pending parts publish either. A whole run's group name is as before.
concurrency:
  group: packs-${{ inputs.target || 'staging' }}${{ inputs.parts && (inputs.mode == 'no-upload' && '-parts-measure' || '-parts') || '' }}-${{ inputs.language }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ${{ inputs.target == 'production' && 'packs-production' || 'packs-staging' }}
    env:
      LANGUAGE: ${{ inputs.language }}
      MODE: ${{ inputs.mode }}
      REQUESTED_COMPAT: ${{ inputs.compat }}
      FORCE: ${{ inputs.force }}
      PARTS: ${{ inputs.parts }}
      COMPARE: ${{ inputs.compare }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The language reaches a shell, a bucket key and a log: only a plain code passes. The value is never printed.
      - name: Validate inputs
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if ! [[ "$LANGUAGE" =~ ^[a-z]{2,3}(-[A-Za-z0-9]+)*$ ]]; then
            echo "::error::language is not a language code"
            exit 1
          fi
          case "$MODE" in publish | no-upload) ;; *) echo "::error::mode must be publish or no-upload"; exit 1 ;; esac
          # The Worker reads no part yet: parts in production would be bytes nobody serves, under keys nothing cleans.
          if [ "$PARTS" = true ] && [ "$MODE" = publish ] && [ "$TARGET" = production ]; then
            echo "::error::parts publish to production waits for the Worker (delivery 3)"
            exit 1
          fi
          # Published parts are what the Worker serves and compares with the code master builds (status/builder.json):
          # a branch's lists would carry a code nothing else builds. A measurement (no-upload) may run from any branch.
          if [ "$PARTS" = true ] && [ "$MODE" = publish ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::parts publish runs only from master; use mode no-upload to measure a branch"
            exit 1
          fi
          # The comparison builds the whole packs beside the parts, into the runner: nothing of it is published.
          if [ "$COMPARE" = true ] && { [ "$PARTS" != true ] || [ "$MODE" != no-upload ]; }; then
            echo "::error::compare needs parts and mode no-upload"
            exit 1
          fi
          # The same shape the Worker and packs-status check: the compat becomes a bucket key.
          if [ -n "$REQUESTED_COMPAT" ] && ! [[ "$REQUESTED_COMPAT" =~ ^f[0-9]+\.[0-9]+-u[A-Za-z0-9_.]+-p[0-9]+-q[0-9]+-a[0-9]+-t[0-9]+$ ]]; then
            echo "::error::compat is not a compat key"
            exit 1
          fi

      - name: Checkout tc-study
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Not shallow: the MACULA identity is the last commit that touched trees/ and referents/, found in the history.
      - name: Clone Taller
        run: git clone --filter=blob:none https://github.com/idiomaspuentes/taller "$RUNNER_TEMP/taller"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Build pack tools
        run: bash scripts/build-pack-tools.sh

      # The Worker asks for builds of the compat it was deployed with. Code that builds another one (a compat bump not yet
      # followed by a v2 redeploy) would publish where the Worker never looks and be dispatched again every hour: it marks
      # the requested compat failed instead, which the Worker's guard reads, and builds nothing.
      # A parts run is checked against the parts compat (PARTS_FORMAT_VERSION, f2.0), the Worker's CURRENT_PARTS_COMPAT.
      - name: Check compat
        if: inputs.compat != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          kind=()
          constant=CURRENT_PACK_COMPAT
          if [ "$PARTS" = true ]; then kind=(--parts); constant=CURRENT_PARTS_COMPAT; fi
          built="$(bun packages/resource-pipeline/cli/packs-status.ts --print-compat "${kind[@]}")"
          if [ "$REQUESTED_COMPAT" = "$built" ]; then exit 0; fi
          echo "::error::asked for compat $REQUESTED_COMPAT, this code builds $built: update $constant in translation-helps-mcp (v2) and redeploy"
          # A parts run marks only a parts compat (f2 and later, the Worker's isPartsCompat): an f1.1 compat names whole
          # packs' status, which a parts run never writes.
          if [ "$PARTS" = true ] && ! [[ "$REQUESTED_COMPAT" =~ ^f([2-9]|[0-9]{2,})\. ]]; then
            echo "::warning::$REQUESTED_COMPAT is not a parts compat: its status is left as it is"
          elif [ "$MODE" = publish ]; then
            bun packages/resource-pipeline/cli/packs-status.ts --lang "$LANGUAGE" --state failed --run "$RUN_URL" --compat "$REQUESTED_COMPAT" "${kind[@]}"
          fi
          exit 1

      # Runs that fail before this step leave no status of their own; the Worker writes `running` when it dispatches
      # (plan 2, Task 5), and counts a `running` mark it replaces after 5.5 hours as a failure, so they still count.
      # Only a publish run owns the language's status: a measurement must not flip it, nor count as a failure.
      # A parts publish writes the parts compat's status (status/f2.0-…), never the f1.1 one the Worker reads.
      - name: Status running
        id: running
        if: inputs.mode == 'publish'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          status=(--lang "$LANGUAGE" --state running --run "$RUN_URL")
          if [ "$PARTS" = true ]; then status+=(--parts); fi
          bun packages/resource-pipeline/cli/packs-status.ts "${status[@]}"

      # The code this run builds with, which the Worker compares with each published parts list's code (packs-builder.yml
      # writes it on every push to master; a run that publishes says so too). Only from master: a branch's code is not
      # what the Worker's own dispatches (ref master) build. Nor once master has moved on: packs-builder.yml may already
      # have written the newer code, which this older checkout must not put back. A failed write does not stop the build
      # it only describes.
      - name: Builder code
        if: inputs.mode == 'publish' && inputs.parts && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          head="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::master is at ${head:-?} now, not $GITHUB_SHA: the builder file is left to packs-builder.yml"
            exit 0
          fi
          bun packages/resource-pipeline/cli/packs-status.ts --builder --commit "$GITHUB_SHA"

      # A no-upload run is given no bucket: against the real one it would stop at «unchanged» and measure nothing.
      - name: Build and publish
        id: publish
        env:
          GENERATOR: ${{ github.sha }}
          R2_ENDPOINT: ${{ inputs.mode == 'publish' && secrets.R2_ENDPOINT || '' }}
          R2_BUCKET: ${{ inputs.mode == 'publish' && secrets.R2_BUCKET || '' }}
          R2_ACCESS_KEY_ID: ${{ inputs.mode == 'publish' && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.mode == 'publish' && secrets.R2_SECRET_ACCESS_KEY || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/packs-out"
          args=(--lang "$LANGUAGE" --work "$RUNNER_TEMP/packs-work" --generator "$GENERATOR" --macula "$RUNNER_TEMP/taller/public" --lexicons-ref master)
          runner=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          if [ "$MODE" = no-upload ]; then args+=(--no-upload); fi
          # Parts in both modes. A parts publish is measured too: its time and memory are what carrying units saves.
          if [ "$PARTS" = true ]; then args+=(--parts); fi
          if [ "$MODE" = no-upload ] || [ "$PARTS" = true ]; then
            command -v /usr/bin/time > /dev/null || { sudo apt-get update -q && sudo apt-get install -y time; }
            runner=(/usr/bin/time -v -o "$RUNNER_TEMP/packs-out/time.txt")
          fi
          # What Door43 or a library prints could look like a workflow command: none is read until the token comes back.
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          "${runner[@]}" bun packages/resource-pipeline/cli/publish-language.ts "${args[@]}" > "$RUNNER_TEMP/packs-out/stdout.txt"
          tail -n 1 "$RUNNER_TEMP/packs-out/stdout.txt" > "$RUNNER_TEMP/packs-out/result.json"
          # The step's exit code decides success; an unreadable result line only costs the summary its outcome.
          outcome="$(jq -r '.outcome // "unknown"' "$RUNNER_TEMP/packs-out/result.json" || echo unknown)"
          {
            echo "### Packs: $LANGUAGE"
            echo "Outcome: \`$outcome\`"
            if [ -f "$RUNNER_TEMP/packs-out/time.txt" ]; then
              echo
              echo '```'
              grep -E 'Maximum resident set size|Elapsed \(wall clock\)' "$RUNNER_TEMP/packs-out/time.txt" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # What a parts run built, carried and put, its tree checks, and the part sizes the bucket counts are chosen from.
      # A step of its own so that a failed run gets it too: a parts run exits 1 on failures it still wrote out. Every
      # field may be missing (a run stopped early): it then shows as «?» or is left out, and never fails the step.
      - name: Parts summary
        if: always() && inputs.parts && steps.publish.conclusion != 'skipped'
        run: |
          line="$(tail -n 1 "$RUNNER_TEMP/packs-out/stdout.txt" 2> /dev/null || true)"
          report="$RUNNER_TEMP/packs-work/parts-report.json"
          {
            echo
            echo "### Parts"
            if [ -n "$line" ] && printf '%s\n' "$line" | jq -e 'type == "object"' > /dev/null 2>&1; then
              printf '%s\n' "$line" | jq -r '
                "Units: \(.units.built? // "?") built, \(.units.carried? // "?") carried",
                "Parts: \(.parts.put? // "?") put, \(.parts.present? // "?") already there (\(.parts.language? // "?") of the language, \(.parts.originals? // "?") originals)",
                "Peak: \(.peakRssMb? // "?") MB; failures: \(.failures? // "?")"' || true
            else
              echo "No result line: the build stopped before printing it."
            fi
            if [ -f "$report" ] && jq -e 'type == "object"' "$report" > /dev/null 2>&1; then
              jq -r '
                def n: if type == "number" then (. * 10 | round / 10 | tostring) else "?" end;
                def kb: if type == "number" then (. / 102.4 | round / 10 | tostring) else "" end;
                def mb: if type == "number" then (. / 104857.6 | round / 10 | tostring) else "?" end;
                "Tree checks: \(.treeChecks.match? | n) match, \(.treeChecks.mismatch? | n) mismatch, \(.treeChecks.unverified? | n) unverified",
                "Books whose rows carry their release stamp: \(.releaseStampedBooks? | if type == "array" then length else "?" end)",
                "Downloads: \(.downloads.archives? | n) archives, \(.downloads.bytes? | mb) MB, \(.downloads.seconds? | n) s",
                ((.sizes? // empty | if type == "object" then to_entries else [] end)
                  | map(select((.key | test("^(tw|ta|lexicon|book)(:|$)")) and (.value | type == "object")))
                  | sort_by(.key)
                  | if length == 0 then empty else
                      "", "| Sizes | parts | total KB | min KB | median KB | max KB |", "|---|--:|--:|--:|--:|--:|",
                      (.[] | "| \(.key) | \(.value.parts | n) | \(.value.bytes | kb) | \(.value.min | kb) | \(.value.median | kb) | \(.value.max | kb) |")
                    end)' "$report" || true
            else
              echo "No readable parts-report.json."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The parts build must pack exactly the rows the whole build packs (plan 2b-1, Task 7). Both run here, where Door43
      # is reachable, into separate work folders; nothing is uploaded. Runs even when the parts step failed, since a
      # parts run exits 1 on failures it still wrote out, and the comparison says which rows those failures cost.
      - name: Whole build and compare
        if: always() && inputs.compare && steps.publish.conclusion != 'skipped'
        env:
          GENERATOR: ${{ github.sha }}
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          whole="$RUNNER_TEMP/packs-whole"
          bun packages/resource-pipeline/cli/publish-language.ts --lang "$LANGUAGE" --work "$whole" --generator "$GENERATOR" \
            --macula "$RUNNER_TEMP/taller/public" --lexicons-ref master --no-upload > "$RUNNER_TEMP/packs-out/whole-stdout.txt"
          status=0
          bun packages/resource-pipeline/cli/compare-parts.ts --pack "$whole/packs/$LANGUAGE.langpack.zip" \
            --originals "$whole/packs/originals.langpack.zip" --parts "$RUNNER_TEMP/packs-work" --examples 20 \
            > "$RUNNER_TEMP/packs-out/compare.txt" || status=$?
          {
            echo
            echo "### Compare (whole vs parts): exit $status"
            echo '```'
            head -n 200 "$RUNNER_TEMP/packs-out/compare.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # A cancelled or timed-out run counts as a failed one: left at «running» it would hold the dispatch for hours.
      # An ok parts status records the code the run built, from its result line (its lists' `code`, the one published),
      # which the Worker compares with status/builder.json: a code change counts as built even when no list moved.
      - name: Status result
        if: always() && inputs.mode == 'publish' && steps.running.outcome == 'success'
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          state=failed
          if [ "$PUBLISH_OUTCOME" = success ]; then state=ok; fi
          status=(--lang "$LANGUAGE" --state "$state" --run "$RUN_URL")
          if [ "$PARTS" = true ]; then
            status+=(--parts)
            if [ "$state" = ok ]; then
              code="$(jq -r 'if (.code | type) == "string" then .code else empty end' "$RUNNER_TEMP/packs-out/result.json" 2> /dev/null || true)"
              if [ -n "$code" ]; then status+=(--code "$code"); else echo "::warning::the result line names no code: the ok status records none"; fi
            fi
          fi
          bun packages/resource-pipeline/cli/packs-status.ts "${status[@]}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packs-result
          # parts-report.json: each unit's memory and time, what a parts run measures (there too when jobs failed).
          # catalog/: a parts run's lists, as built (a whole run writes none there).
          path: |
            ${{ runner.temp }}/packs-out
            ${{ runner.temp }}/packs-work/parts-report.json
            ${{ runner.temp }}/packs-work/catalog/
          if-no-files-found: ignore
          retention-days: 14
