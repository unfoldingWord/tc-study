name: Packs builder

# Writes the code master's parts build runs with to status/builder.json in each packs bucket
# (packages/resource-pipeline/cli/packs-status.ts --builder). The serving Worker compares it with the `code` of every
# published parts list and asks for a rebuild of a list built by older code; it cannot compute that code itself. Runs on
# every push to master that may change it (any package, the root package.json, the lockfile, the build script) and by
# hand. Every parts publish run from master writes it too (language-packs.yml).
# GitHub matches `paths` against at most the first 300 files a push changes: a bulk push may not start it. The next
# parts publish from master writes the code then, or run it by hand.

on:
  push:
    branches:
      - master
    paths:
      - packages/**
      - package.json
      - bun.lock
      - scripts/build-pack-tools.sh
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  staging:
    # A dispatch from a branch would write that branch's code, which no build the Worker dispatches (ref master) gives.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: packs-staging
    # The latest push's code is the one master builds: an older run still going is of no use.
    concurrency:
      group: packs-builder-staging
      cancel-in-progress: true
    steps:
      - name: Checkout tc-study
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      # The code hashes the installed dependencies too, so it is computed over the same install a build runs on.
      - name: Build pack tools
        run: bash scripts/build-pack-tools.sh

      - name: Write status/builder.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun packages/resource-pipeline/cli/packs-status.ts --builder --commit "$GITHUB_SHA"

  # Production only once its Worker serves parts (repository variable PACKS_PARTS_PRODUCTION, set with Abel's yes).
  production:
    if: github.ref == 'refs/heads/master' && vars.PACKS_PARTS_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: packs-production
    concurrency:
      group: packs-builder-production
      cancel-in-progress: true
    steps:
      - name: Checkout tc-study
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Build pack tools
        run: bash scripts/build-pack-tools.sh

      - name: Write status/builder.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun packages/resource-pipeline/cli/packs-status.ts --builder --commit "$GITHUB_SHA"
